name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sport_rent
          POSTGRES_PASSWORD: sport_rent_ci
          POSTGRES_DB: sport_rent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sport_rent -d sport_rent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://sport_rent:sport_rent_ci@127.0.0.1:5432/sport_rent_test
      TEST_DATABASE_URL: postgresql+asyncpg://sport_rent:sport_rent_ci@127.0.0.1:5432/sport_rent_test
      JWT_ACCESS_SECRET: 4fe247d4a7a761d46ae733c7a5de6d2f96c997db154cb532e29e2c52e046ff7f
      JWT_ACCESS_EXPIRATION: "900"
      JWT_REFRESH_SECRET: 76d7746a1ab52a3f91ba3c3dd169c8194e4f36b74e8c995ab6fdbdeea09e3dda
      JWT_REFRESH_EXPIRATION: "2592000"
      JWT_REFRESH_GRACE_PERIOD: "5"
      CSRF_EXPIRATION: "2592000"
      AUTH_COOKIE_SECURE: "false"
      SEED_USER_PASSWORD: Test123!
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USERNAME: ci
      SMTP_PASSWORD: ci
      SMTP_FROM_EMAIL: no-reply@example.test
      SMTP_USE_TLS: "false"
      SMTP_USE_AUTH: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Apply migrations
        run: uv run --no-sync alembic upgrade head

      - name: Check model and migration consistency
        run: uv run --no-sync alembic check

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Check migration downgrade
        run: uv run --no-sync alembic downgrade base

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci
